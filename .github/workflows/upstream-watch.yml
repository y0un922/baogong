# The fork's watch on upstream (tool/upstream_watch.sh): once a day, an
# issue for upstream's commits not merged yet, and one for each repository
# baocode-dev makes public. Run it by hand from the Actions tab too.
name: Upstream watch

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 in China
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'y0un922/baogong'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/baocode-dev/baocode.git
          git fetch --no-tags upstream main
      - name: Update the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/upstream_watch.sh
