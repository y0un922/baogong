# Builds bao_iroh's Rust (iroh) for each target the apps are built for, on
# the runners they are built on, and keeps it in main's cache for rust/ as
# it is. The builds (release.yml, remote.yml, mobile.yml) restore it,
# through .github/actions/bao-iroh-prebuilt, and bao_iroh's build hook
# takes it rather than build iroh again, several minutes each time.
#
# On main, as a tag's run can restore only main's caches. Each day too, as
# GitHub drops a cache a week unused; one already there is not built again.
#
#   Actions → bao_iroh → Run workflow   build it for main as it is
#
# Fork: no mobile job (Android, iOS). fork-release.yml builds no phone app,
# and the iOS job's macOS runner, often not had, failed the nightly run.
name: bao_iroh

on:
  push:
    branches: [main]
    paths:
      - packages/bao_iroh/rust/**
      - .github/workflows/bao_iroh.yml
      - .github/actions/bao-iroh-prebuilt/**
      - .github/actions/setup-rust/**
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # release.yml's runners: each key names its OS and arch.
  desktop:
    name: Build for ${{ matrix.targets }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Mac builds both its apps.
          - runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            lib: libbao_iroh.dylib
          - runner: windows-latest
            targets: x86_64-pc-windows-msvc
            lib: bao_iroh.dll
          - runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            lib: bao_iroh.dll
          # In the oldest Ubuntu built in, for its glibc (release.yml's
          # container): one built on the runner's would ask for its newer one.
          - runner: ubuntu-22.04
            container: ubuntu:20.04
            targets: x86_64-unknown-linux-gnu
            lib: libbao_iroh.so
          - runner: ubuntu-22.04-arm
            container: ubuntu:20.04
            targets: aarch64-unknown-linux-gnu
            lib: libbao_iroh.so
    container: ${{ matrix.container }}
    steps:
      # The bare image has none of the runner's tools: git first, for the
      # checkout to be a repository. zstd, for the cache to be saved as the
      # runners' (a cache is found only where it is unpacked the same way).
      - name: Install the build's tools
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The mirror the runners use (an x64 image's; an Arm one's is
          # ports.ubuntu.com), and again where a fetch failed: apt-get
          # update only warns of it.
          sed -i 's#http://\(archive\|security\)\.ubuntu\.com#http://azure.archive.ubuntu.com#' \
            /etc/apt/sources.list
          for attempt in 1 2 3 4 5; do
            apt-get -o Acquire::Retries=5 update 2>&1 | tee "$RUNNER_TEMP/apt.log" || true
            grep -q '^[WE]: Failed to fetch' "$RUNNER_TEMP/apt.log" || break
            [ "$attempt" = 5 ] && exit 1
            sleep 15
          done
          apt-get -o Acquire::Retries=5 install -y build-essential ca-certificates curl git zstd
      - uses: actions/checkout@v5
      - id: cached
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      # As native_toolchain_rust builds it (the hook, with none here), into
      # build/prebuilt/<target>/, where the hook looks.
      - name: Build
        if: steps.cached.outputs.hit != 'true'
        shell: bash
        working-directory: packages/bao_iroh/rust
        env:
          TARGETS: ${{ matrix.targets }}
          LIB: ${{ matrix.lib }}
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --package bao_iroh --target "$target" \
              --target-dir "$RUNNER_TEMP/target"
            mkdir -p "../build/prebuilt/$target"
            cp "$RUNNER_TEMP/target/$target/release/$LIB" "../build/prebuilt/$target/"
          done
          ls -lR ../build/prebuilt
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/bao-iroh-prebuilt
        with:
          save: true
